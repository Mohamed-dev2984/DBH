<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jan's M87</title>
  <style>
    body {
      background:lightgray;
    }
  #hour {
      font-size:7vw;
      color:white;
      text-align: center;
      background:blue;
      border-radius:2vw;
      padding:4vw;
      border:10px solid black;
    }
    #Stat {
      color:white;
      font-size:7vw;
    }
    #sun {
      display:inline-block;
      width:9vw;
      height:9vw;
      background:blue;
      border-radius:50%;
      border:20px solid lightblue;
    }
    .apps {
      display:inline-block;
      width:6.5vw;
      height:6.5vw;
      border:5px solid black;
      border-radius:2vw;
    }
    #blueApp {
      background:blue;
    }
    #redApp {
      background:red;
    }
    #orangeApp {
      background:orange;
    }
    #whiteApp {
      background:white;
    }
    #brownApp {
      background:#582020;
    }
    #orange_Red_App {
      background:orangered;
    }
    #yellowApp {
      background:yellow;
    }
    #pinkApp {
      background:pink;
    }
    #blackApp {
      background:black;
    }
  </style>
</head>
<body>
  <div>
  <span id="sun"></span>
  <p id="Stat">SO COLD: 1°</p>
  </div>
  <p id="hour">9:00 AM</p>
  <span class="apps" id="blueApp"></span>
  <span class="apps" id="redApp"></span>
  <span class="apps" id="orangeApp"></span>
  <span class="apps" id="whiteApp"></span>
  <span class="apps" id="brownApp"></span>
  <span class="apps" id="orange_Red_App"></span>
  <span class="apps" id="yellowApp"></span>
  <span class="apps" id="pinkApp"></span>
  <span class="apps" id="blackApp"></span>
</body>
</html>
